version: 1

document:
  output: "./build/Практическая работа 4 - Надёжное транзакционное ядро и исходящие события.docx"
  title_page:
    template: titul
    params:
      work_number: "4"
      discipline: "Распределенные хранилища данных"
      work_title: "Надёжное транзакционное ядро и исходящие события"
      group: "УВП-171"
      student: "Орлова О. А."
      teacher: "ст.п. Заманов Е.А."
  toc: true

content:
  - type: heading
    text: "Цель работы"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Делаем так, чтобы заказ, ответ команды и событие о нём сохранялись одной транзакцией или не
      сохранялись совсем. Проверяем это на настоящей команде оплаты, а затем выполняем вариант А:
      повтор команды и граница отката.
  - type: paragraph
    text: >
      Работу выполняем на своём сквозном проекте - онлайн-кинотеатре «Плёнка». Вместо задачи TeamBoard
      у нас заказ на покупку фильма, вместо команды CreateTask - оформление заказа, вместо события
      task.created - событие о смене статуса заказа. Стенд: Go 1.26, PostgreSQL 16.15, тесты идут под
      ролью данных с детектором гонок, 16.11.2026.

  - type: heading
    text: "Ход работы"
    level: 1
    structural: true

  - type: heading
    text: "Очередь событий"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Событие нельзя отправлять в брокер прямо из команды: между сохранением заказа и отправкой
      сервис может упасть. Поэтому в ту же схему, где лежат заказы, добавлена таблица outbox. Команда
      кладёт в неё обязательство отправить событие, а отправляет его отдельный ретранслятор. Таблица
      показана на рисунке 1.
  - type: figure
    caption: "Таблица billing.outbox и её политики"
    path: "./images/01-outbox-schema.png"
  - type: paragraph
    text: >
      У события уникальный event_id, по нему получатель отсекает повторы. Поля lease_owner и
      lease_until нужны для аренды, attempts и last_error - чтобы видеть застрявшие события. Читать и
      отмечать очередь может только транзакция ретранслятора. Роли данных оставлена одна вставка.

  - type: heading
    text: "Контракт события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Событие называется order.status_changed и несёт снимок заказа целиком. Поля конверта собраны в
      таблице 1.
  - type: table
    caption: "Поля конверта billing.orders.v1"
    headers: ["Поле", "Зачем нужно"]
    rows:
      - ["id", "Идентификатор события, ключ для отсечения повторов у получателя"]
      - ["type", "Тип события, по нему выбирается обработчик"]
      - ["schema_version", "Версия структуры данных внутри темы"]
      - ["aggregate_id", "Идентификатор заказа и ключ сообщения: события одного заказа идут в один раздел"]
      - ["revision", "Номер шага оплаты: charging 1, completed или failed 2, refunding 3, refunded 4"]
      - ["occurred_at", "Время создания события, только для диагностики"]
      - ["source", "Издатель - billing"]
      - ["correlation_id", "Ключ идемпотентности исходной команды"]
      - ["data", "Снимок заказа: зритель, фильм или тариф, сумма, статус"]
  - type: paragraph
    text: >
      Получатель при повторной доставке вставляет отметку с id события во входящий журнал. Если
      отметка уже есть, он выходит без действия. Событие с ревизией не больше сохранённой проекцию не
      меняет.

  - type: heading
    text: "Команда оплаты и событие в одной транзакции"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Оплата идёт в три шага, и каждый шаг - своя транзакция, в которой заказ и событие меняются
      вместе. На шаге подготовки вставляется заказ с ключом идемпотентности и событие charging. После
      ответа банка выдаётся покупка, заказ переходит в completed, и пишется второе событие. При отказе
      банка пишется событие failed.
  - type: paragraph
    text: >
      Четыре теста на настоящей команде показаны на рисунке 2. После покупки у заказа ровно два
      события с ревизиями 1 и 2. Повтор с тем же ключом возвращает тот же заказ и событий не
      добавляет. Тот же ключ с другой командой отклоняется. Сбой после записи события оставляет ноль
      заказов и ноль событий.
  - type: figure
    caption: "Фиксация, повтор, конфликт и откат"
    path: "./images/02-base-tests.png"

  - type: heading
    text: "Вариант А, пункт 1. Одновременные дубликаты и пять повторов"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Восемь запросов с одним ключом отправляем одновременно. После них тот же запрос повторяем ещё
      пять раз подряд, новый ключ в цикле не создаём. Каждый повтор возвращает прежний заказ в статусе
      completed. Идентификаторы двух событий заказа после каждого повтора те же. В базе один заказ,
      одна покупка и два события. Вывод на рисунке 3.
  - type: figure
    caption: "Восемь одновременных запросов и пять повторов"
    path: "./images/03-a1-replays.png"
  - type: paragraph
    text: >
      Этот тест сначала не прошёл. Один из восьми запросов получил ошибку базы о нарушении
      уникальности ключа идемпотентности, и зритель увидел бы ошибку сервера. Причина: два запроса
      одновременно не находят заказ по ключу и оба его вставляют. PostgreSQL сообщает проигравшему не
      об ошибке сериализации, которую шаг уже умел повторять, а о нарушении уникальности. Исправление:
      шаг подготовки повторяется и в этом случае. При повторе он находит заказ по ключу и возвращает
      его как повтор запроса.

  - type: heading
    text: "Вариант А, пункт 2. Прежний ключ, другая цель"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Оставляем прежний ключ, но меняем цель команды: вместо первого фильма покупаем второй. Команда
      отклонена с ошибкой idempotency_mismatch. Отдельным запросом к базе проверяем, что заказа и
      покупки второго фильма не появилось и событий в очереди осталось два. Это рисунок 4.
  - type: figure
    caption: "Прежний ключ с другим фильмом отклонён"
    path: "./images/04-a2-conflict.png"

  - type: heading
    text: "Вариант А, пункт 3. Сбой перед записью события"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Строка заказа уже вставлена в транзакцию, а запись события в очередь отказывает. Сбой делаем
      триггером на таблице outbox: он срабатывает ровно в этой точке, и код сервиса менять не нужно.
      После сбоя заказов ноль, покупок ноль, событий ноль. Затем триггер убираем, и тот же запрос с
      тем же ключом проходит как новый. На рисунке 5 рядом показан и сбой после записи события.
  - type: figure
    caption: "Сбой после записи события и сбой при записи события"
    path: "./images/05-a3-rollback.png"
  - type: paragraph
    text: >
      Обе точки сбоя дают одно и то же состояние, потому что обе лежат внутри одной транзакции. Пока
      она не зафиксирована, для остальных нет ни заказа, ни события, а откат убирает всё, что успело
      в неё попасть. Порядок действий внутри транзакции на итог не влияет. Важно только, что событие
      пишется в ту же транзакцию, а не после неё.

  - type: heading
    text: "Захват событий и изоляция очереди"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Ретранслятор берёт пачку событий в аренду короткой транзакцией и отправляет её уже вне
      транзакции. Если он упал, аренда истекает, и пачку забирает другой ретранслятор с теми же
      идентификаторами событий. Два ретранслятора одну пачку не отправляют. Роль данных очередь не
      читает и не меняет, даже если объявит себя ретранслятором. Тесты на рисунке 6.
  - type: figure
    caption: "Изоляция очереди и аренда ретранслятора"
    path: "./images/06-isolated-lease.png"

  - type: heading
    text: "Измерение очереди"
    level: 2
    structural: false
  - type: paragraph
    text: >
      На стенде после нагрузочного опыта в очереди 20 098 событий, все отправлены, ожидающих нет.
      Счётчик попыток растёт при каждом захвате в аренду, и у всех событий он равен единице: каждое отправлено с первого захвата. Возраст самого
      старого ожидающего события пуст, очередь разобрана. Последние четыре строки - это четыре шага
      одного заказа с ревизиями от 1 до 4. Запрос и ответ на рисунке 7.
  - type: figure
    caption: "Состояние очереди на стенде"
    path: "./images/07-queue.png"
  - type: paragraph
    text: >
      Полный прогон тестов сервиса оплаты с детектором гонок проходит, это рисунок 8.
  - type: figure
    caption: "Полный прогон тестов billing"
    path: "./images/08-all-race.png"

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Заказ и событие о нём фиксируются одной транзакцией на каждом шаге оплаты. Пять повторов после
      восьми одновременных запросов возвращают прежний ответ и не меняют ни событий, ни числа строк.
      Прежний ключ с другим фильмом отклоняется и следов не оставляет. Сбой до записи события и сбой
      после неё дают одинаковый итог - ноль строк.
  - type: paragraph
    text: >
      Тест варианта нашёл настоящий дефект: одновременный дубликат получал ошибку сервера вместо
      прежнего ответа. Он исправлен повтором шага при нарушении уникальности ключа. У очереди в нашей
      системе нет арендатора, поэтому вставка в неё политикой не ограничена: защита от записи ложного
      события остаётся на уровне приложения.
