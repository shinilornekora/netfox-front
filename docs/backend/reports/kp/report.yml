version: 1

document:
  output: "./build/Курсовой проект - Хранение данных онлайн-кинотеатра Плёнка.docx"
  title_page:
    template: titul-kp
    params:
      discipline: "Распределенные хранилища данных"
      work_title: "Хранение данных онлайн-кинотеатра „Плёнка“"
      group: "УВП-171"
      student: "Орлова О. А."
      teacher: "ст.п. Заманов Е.А."
  toc: true

content:
  - type: heading
    text: "Введение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      «Плёнка» - онлайн-кинотеатр. Зритель смотрит фильмы и сериалы по подписке или покупает фильм
      навсегда, продолжает с места остановки и ведёт список «Смотреть позже». Администратор заводит
      тайтлы, публикует их и видит продажи. На этой предметной области выполнены все практические
      работы, а в проекте они собраны в одну систему из четырёх сервисов и шлюза.
  - type: paragraph
    text: >
      В проекте мы отвечаем на пять вопросов. Кто владеет какими данными. Как защищены данные
      зрителей. Как не списать деньги дважды. Как события доходят между сервисами. Что показывает
      система под нагрузкой. На каждый вопрос даём решение, альтернативу и цену, а затем проверку,
      которую можно повторить.
  - type: paragraph
    text: >
      Всего в журнале проекта 125 решений с ценой и условием пересмотра и 20 дефектов, найденных
      тестами и прогонами. В записке - главные из них.

  - type: heading
    text: "Система и границы"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Сервисы и их данные показаны на рисунке 1 и в таблице 1. Границы проходят не по сущностям, а по
      характеру нагрузки и по тому, кто принимает решение.
  - type: figure
    caption: "Сервисы «Плёнки» и потоки данных"
    path: "./images/01-architecture.png"
  - type: table
    caption: "Сервисы и данные, которыми они владеют"
    headers: ["Сервис", "За что отвечает", "Чем владеет"]
    rows:
      - ["gateway", "Проверка сессии, защита от подделки запросов, лимиты", "Ничем, только кэш сессий в памяти"]
      - ["identity", "Регистрация, вход, сессии, устройства", "Аккаунты, сессии"]
      - ["catalog", "Карточки фильмов и сериалов, публикация, поиск", "Тайтлы, серии, очередь событий"]
      - ["billing", "Оплата, подписки, покупки, решение «можно ли смотреть»", "Заказы, покупки, подписки, очередь событий, копия тайтлов"]
      - ["playback", "Старт просмотра, прогресс, история, «Смотреть позже»", "Прогресс, история, список, лента заказов, копия тайтлов"]
  - type: paragraph
    text: >
      Просмотр отделён от каталога, потому что пинги прогресса идут каждые несколько секунд от
      каждого зрителя, а каталог меняется редко. Право смотреть решает billing, потому что оно
      следует из денег. Кинотеатру на тысячу зрителей хватило бы монолита, и мы говорим это прямо:
      сеть, брокер и пять процессов - цена учебного эталона.
  - type: figure
    caption: "Витрина кинотеатра"
    path: "./images/03-ui-home.png"

  - type: heading
    text: "Кто владеет данными"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Правило одно: в таблицу пишет только её владелец. База одна, но у каждого сервиса своя схема и
      свои роли, и роль одного сервиса не читает схему другого. Это проверяет отдельный тест
      изоляции ролей.
  - type: paragraph
    text: >
      Тайтл нужен трём сервисам, и общей таблицы для него мы не сделали. Каталог владеет карточкой и
      публикует событие-снимок при каждом изменении. Billing и playback держат у себя копии только
      тех полей, которые им нужны, и применяют только более новую ревизию. Если каталог упал,
      просмотр и оплата продолжают работать. Цена - копии отстают на секунды, и данные дублируются.
  - type: paragraph
    text: >
      Синхронных вызовов между сервисами ровно два: шлюз спрашивает identity о сессии, а playback
      спрашивает billing, можно ли смотреть. Второй вызов прикрыт прерывателем и кэшем решений. Новый
      фильм при упавшем billing не откроется, и это осознанный выбор: лучше отказать, чем показать
      неоплаченное.

  - type: heading
    text: "Как защищены данные зрителей"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Арендатор у нас - зритель. Модель размещения общая: строки всех зрителей лежат в одних
      таблицах. Отдельная схема на зрителя означала бы миллион схем. Цена общей модели: ошибка в
      политике открывает данные всех сразу. Поэтому уровней принуждения два, и они независимы.
  - type: table
    caption: "Два уровня защиты"
    headers: ["Уровень", "Как работает"]
    rows:
      - ["Приложение", "Личность зрителя приходит только из подписи шлюза, сам запрос её задать не может. Без личности запрос до базы не доходит"]
      - ["База", "Защита строк с принуждением на прогрессе, истории, списке и ленте заказов. Контекст зрителя ставится на одну транзакцию. Запросы идут под ролью данных, которая таблицами не владеет"]
  - type: paragraph
    text: >
      Отрицательные тесты идут прямым SQL мимо сервиса (рисунок 3). Чужое не читается. За другого
      записать нельзя. Без контекста возвращается ноль строк. Роль данных не может снять защиту. На
      ревью нашлась одна дыра: история разбита на секции по месяцам, а секции не наследуют политику
      родительской таблицы, и прямой запрос к секции видел всех. Теперь у каждой секции своя
      политика, и на это есть тест.
  - type: figure
    caption: "Отрицательные тесты изоляции зрителей"
    path: "./images/04-tenancy.png"
  - type: paragraph
    text: >
      Границы защиты называем сразу. Политика верит контексту, который ставит код сервиса: если код
      нарочно подставит чужого зрителя, база его пустит. Владелец схемы может снять защиту. Заказы и
      права в billing защитой строк не закрыты: там другой риск - деньги, и он закрыт транзакциями.
  - type: figure
    caption: "Личный кабинет зрителя"
    path: "./images/03-ui-cabinet.png"

  - type: heading
    text: "Как не списать деньги дважды"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Оплата - сага внутри billing (рисунок 5). Шаг подготовки создаёт заказ, затем идёт звонок в
      банк вне транзакции, затем выдаются права. Если банк списал, а выдать права уже нельзя, деньги
      возвращаются. Если банк молчит, зритель получает ответ «обрабатывается», а фоновая сверка
      каждые пять секунд доводит зависшие заказы до конца.
  - type: figure
    caption: "Состояния заказа"
    path: "./images/02-saga.png"
  - type: paragraph
    text: >
      Опасное место - две вкладки. Зритель жмёт «купить» в обеих, обе транзакции видят «заказа нет» и
      обе создают заказ. Это перекос записи: правило связывает несколько строк, и блокировать пока
      нечего. Мы показали это экспериментом (рисунок 6): на уровне READ COMMITTED получается два
      заказа и два списания, на SERIALIZABLE с повтором - один заказ и одно списание.
  - type: figure
    caption: "Эксперимент с двойной оплатой"
    path: "./images/05-skew.png"
  - type: paragraph
    text: >
      Команда оплаты не принимается без ключа идемпотентности. Повтор с тем же ключом возвращает тот
      же заказ. Замер и тесты нашли здесь два дефекта. Первый: ложные конфликты сериализации. Разные
      зрители мешали друг другу, потому что проверка шла по общему индексу, и около 1 % покупок
      заканчивались ошибкой. После перехода на индекс по зрителю ошибок ноль, а p95 упал со 108 до
      18 мс. Второй: два одновременных запроса с одним ключом. Один из них получал ошибку сервера о
      нарушении уникальности вместо прежнего ответа. Теперь шаг подготовки в этом случае
      повторяется.

  - type: heading
    text: "Как события доходят между сервисами"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Заказ и событие о нём пишутся одной транзакцией в таблицу outbox той же схемы. Ретранслятор
      берёт пачку в аренду и публикует её вне транзакции. Получатель одной транзакцией ставит отметку
      во входящем журнале и обновляет свою ленту заказов, а смещение в брокере фиксирует после этого.
      Событие с ревизией не новее сохранённой ничего не меняет.
  - type: paragraph
    text: >
      Ошибки получатель делит на два вида. Постоянную ошибку повтор не исправит, такое сообщение
      уходит в карантин. Временную ошибку он повторяет, пока не получится, и смещение не фиксирует.
      Раньше было иначе: после нескольких попыток корректное событие уходило в карантин, и минута
      простоя базы стоила потерянных событий. Это один из найденных дефектов.
  - type: table
    caption: "Три паттерна согласованности в «Плёнке»"
    headers: ["Паттерн", "Где применён", "Почему"]
    rows:
      - ["На основе событий", "Копии тайтлов в billing и playback, лента заказов", "Отставание в секунды допустимо, зато сервисы не зависят друг от друга"]
      - ["Оркестрация запроса", "Оплата", "Зритель ждёт ответа, и согласованность важнее скорости: это деньги"]
      - ["Фоновая синхронизация", "Не применяется", "Внешний процесс писал бы в чужие таблицы и нарушил владение. Сверка зависших заказов работает только с таблицами billing"]
  - type: paragraph
    text: >
      У каждого механизма своё окно: события - секунды, оплата - до трёх секунд ответа банка, сверка -
      10-15 секунд для зависшего заказа. Продажи в интерфейсе администратора показаны на рисунке 7.
  - type: figure
    caption: "Продажи в интерфейсе администратора"
    path: "./images/03-ui-sales.png"

  - type: heading
    text: "Что показывает нагрузка"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Замер идёт через шлюз, а не голым SQL. Сценарий watch - то, что делает смотрящий зритель: пинг
      прогресса и чтение ленты «Продолжить». Сценарий checkout - покупка. Потоков 1, 8 и 32, по три
      повтора, итог по медиане. В базе 114 тысяч заказов, из них 100 тысяч залиты заранее, чтобы
      таблицы не были пустыми.
  - type: table
    caption: "Итог замера по медиане трёх повторов (1 / 8 / 32 потока)"
    headers: ["Операция", "p95, мс", "p99, мс", "Цель"]
    rows:
      - ["Пинг прогресса", "1.9 / 7.3 / 23.5", "2.5 / 9.7 / 29.4", "Выполнена"]
      - ["Лента «Продолжить»", "1.3 / 6.3 / 22.8", "1.7 / 8.3 / 25.6", "Выполнена"]
      - ["Покупка", "11.8 / 40.3 / 97.1", "15.7 / 52.5 / 112.2", "Выполнена до 8 потоков"]
  - type: paragraph
    text: >
      Ближе всего к исчерпанию процессор стенда: при 32 потоках машина занята на 90 %. Больше всех
      берёт PostgreSQL, но шлюз и playback вместе тратят больше него. Покупка при 32 потоках цель по
      p95 не выполняет, и мы это не скрываем: сериализуемые транзакции и два события на покупку стоят
      времени.
  - type: table
    caption: "Инварианты после опытов"
    headers: ["Инвариант", "Чем защищён", "Нарушений"]
    rows:
      - ["Фильм не куплен одним зрителем дважды", "Первичный ключ покупки; сериализуемая подготовка", "0"]
      - ["У покупки есть завершённый заказ, у заказа - списание", "Сериализуемая выдача прав; ключ списания равен заказу", "0 и 0"]
      - ["Заказы не висят в обработке", "Фоновая сверка раз в 5 секунд", "0"]
      - ["Каждое изменение заказа доходит до получателей", "Событие в одной транзакции с заказом; аренда и повтор", "Неотправленных 0 из 20 024"]
      - ["Старый пинг не затирает новый", "Условная запись по времени устройства", "Проверено тестом"]
  - type: paragraph
    text: >
      Замер оптимистичен: кэш прогрет, всё на одной машине, генератор сам занимает процессор. Цифры
      годятся, чтобы сравнивать решения, но не как обещание для эксплуатации.

  - type: heading
    text: "Проверка"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Все тесты идут с детектором гонок (рисунок 8). Интеграционных тестов на настоящем PostgreSQL
      49, код в них работает под ролью данных, как в эксплуатации. Сценариев получателя на настоящей
      Kafka семь. Модульных тестов 11, плюс тест изоляции ролей и архитектурный тест, который не даёт
      сервисам импортировать друг друга. Сквозной сценарий через шлюз содержит 33 проверки, в том
      числе возврат покупки и закрытие доступа событием.
  - type: figure
    caption: "Полный прогон тестов всех модулей"
    path: "./images/07-tests.png"

  - type: heading
    text: "Главные компромиссы"
    level: 1
    structural: true
  - type: table
    caption: "Решения и их цена"
    headers: ["Решение", "Вместо", "Получили", "Отдали"]
    rows:
      - ["Четыре сервиса и шлюз", "Монолит", "Границы по нагрузке и ответственности", "Сеть, брокер, согласованность в конечном счёте"]
      - ["Схема и роли на сервис в одной базе", "Общая схема или четыре сервера", "Изоляция средствами СУБД", "Общая точка отказа"]
      - ["Копии тайтлов событиями", "Синхронный запрос в каталог", "Просмотр и оплата не зависят от каталога", "Отставание в секунды"]
      - ["Общая модель и защита строк", "Схема на зрителя", "Одна схема", "Ошибка политики открывает всё, нужны два уровня"]
      - ["Оплата на SERIALIZABLE с повторами", "Блокировки или READ COMMITTED", "Нет двойного списания", "Повторы и время на покупку"]
      - ["Сага с фоновой сверкой", "Распределённая транзакция с банком", "Заказ не зависает навсегда", "Окно в 10-15 секунд"]
      - ["Outbox и входящий журнал", "Запись в базу и в брокер подряд", "Событие не теряется и не применяется дважды", "Дубли, задержка, лишние таблицы"]
      - ["Повтор временной ошибки без предела", "Карантин после нескольких попыток", "Корректное событие не теряется", "Раздел темы стоит, пока ошибка не пройдёт"]

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      У каждой таблицы «Плёнки» один владелец, а чужие данные сервисы получают событиями. Данные
      зрителей защищены на двух уровнях, и база не пускает к чужим строкам даже при ошибке в коде
      запроса. Деньги защищены сериализуемыми транзакциями, ключом идемпотентности и сверкой с
      банком. События фиксируются вместе с заказом и доходят без потери и без двойного действия.
  - type: paragraph
    text: >
      Каждое из этих утверждений можно проверить: тестами на настоящей базе и настоящем брокере,
      экспериментом с двойной оплатой, замером с инвариантами после него. Двадцать найденных дефектов
      мы считаем результатом работы: все они найдены до сдачи и закрыты тестами.
  - type: paragraph
    text: >
      Что не сделано: метрики и трассировка, повторная подача сообщений из карантина, отдельные
      серверы базы для сервисов, замер открытым потоком.
