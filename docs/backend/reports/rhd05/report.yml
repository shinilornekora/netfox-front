version: 1

document:
  output: "./build/Практическая работа 5 - Доставка событий.docx"
  title_page:
    template: titul
    params:
      work_number: "5"
      discipline: "Распределенные хранилища данных"
      work_title: "Доставка событий"
      group: "УВП-171"
      student: "Орлова О. А."
      teacher: "ст.п. Заманов Е.А."
  toc: true

content:
  - type: heading
    text: "Цель работы"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Доводим событие из очереди outbox до получателя через брокер. Получатель должен выполнить
      полезное действие один раз, даже если сообщение пришло несколько раз или процесс упал посреди
      обработки. Затем выполняем вариант А: границы подтверждений и устойчивость к дубликатам.
  - type: paragraph
    text: >
      Работаем на своём проекте - онлайн-кинотеатре «Плёнка». Издатель - сервис оплаты billing,
      получатель - сервис просмотра playback. Он ведёт у себя ленту заказов зрителя и по событию
      возврата закрывает доступ к фильму. Стенд: Go 1.26, PostgreSQL 16.15, Apache Kafka,
      16.11.2026. Сценарии варианта идут на настоящем брокере и настоящей базе.

  - type: heading
    text: "Ход работы"
    level: 1
    structural: true

  - type: heading
    text: "Две границы подтверждения"
    level: 2
    structural: false
  - type: paragraph
    text: >
      У получателя два разных подтверждения. Фиксация транзакции в базе означает, что действие
      выполнено. Фиксация смещения в брокере означает, что сообщение больше не придёт. Они не
      атомарны: между ними процесс может упасть. Поэтому смещение мы фиксируем вручную и только после
      того, как судьба сообщения решена.
  - type: list
    style: numeric
    items:
      - "Разбираем конверт. Битый конверт - постоянная ошибка, сообщение уходит в тему с суффиксом .dlq."
      - "Открываем транзакцию и выставляем контекст зрителя для защиты строк."
      - "Вставляем отметку с идентификатором события во входящий журнал. Отметка уже есть - выходим."
      - "Обновляем ленту заказов, если ревизия события больше сохранённой."
      - "Фиксируем транзакцию: отметка и лента сохраняются вместе."
      - "После фиксации сбрасываем кэш доступа, если это возврат."
      - "Фиксируем смещение в брокере."

  - type: heading
    text: "Обработчик и лента заказов"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Обработчик работает под ролью данных, которая таблицами не владеет. Строки ленты закрыты защитой
      строк: зритель видит только свои заказы. Тесты обработчика на настоящей базе показаны на
      рисунке 1. Одно событие трижды даёт одну строку ленты. Повтор после падения отсекается входящим
      журналом. Битое событие получает постоянную ошибку и не оставляет следов. Событие, которое
      пытается переписать заказ другого зрителя, упирается в политику и тоже считается постоянной
      ошибкой.
  - type: figure
    caption: "Тесты обработчика ленты заказов"
    path: "./images/05-order-feed.png"

  - type: heading
    text: "Ошибки контракта и ошибки окружения"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Ошибки делим на два вида. Постоянную повтор не исправит: битый конверт, неразбираемые данные,
      ошибка данных из базы, отказ политики при записи. Такое сообщение кладём в карантин и идём
      дальше. Временная ошибка относится к окружению: база недоступна, истёк тайм-аут. Такое сообщение
      повторяем, пока не получится, и в карантин не кладём. Четыре сценария на настоящем брокере - на
      рисунке 2.
  - type: figure
    caption: "Сценарии доставки на настоящей Kafka"
    path: "./images/04-kafka.png"
  - type: paragraph
    text: >
      Ядовитое сообщение между двумя хорошими один раз уходит в карантин, оба хороших обработаны по
      порядку. Временная ошибка пять раз подряд не теряет событие и не пускает вперёд следующее.
      Падение после фиксации в базе даёт повторную доставку и один эффект. Ошибка данных из базы
      сразу отправляет событие в карантин.

  - type: heading
    text: "Вариант А, пункт 1. Одно событие шесть раз"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Одно сохранённое событие отправляем в тему шесть раз: первая доставка и пять повторов. У каждой
      доставки своё смещение в брокере, от 0 до 5. Обработчик на первую отвечает processed, на
      остальные пять - duplicate. В базе одна отметка входящего журнала и один эффект, в карантине
      пусто. Вывод теста на рисунке 3.
  - type: figure
    caption: "Смещения шести доставок и статусы обработчика"
    path: "./images/01-a1-repeat.png"
  - type: paragraph
    text: >
      Чтобы обработчик знал смещение, получатель кладёт тему, раздел и смещение записи в контекст
      вызова. Это понадобилось и для следующего пункта.

  - type: heading
    text: "Вариант А, пункт 2. Сбой после фиксации в базе"
    level: 2
    structural: false
  - type: paragraph
    text: >
      В теме два события. На первом обработчик фиксирует транзакцию, после чего процесс останавливаем
      до подтверждения смещения. Это тот же случай, что флаг fail-after-db в методичке. Затем
      запускаем получателя снова. Журнал теста на рисунке 4.
  - type: figure
    caption: "После сбоя читается то же смещение"
    path: "./images/02-a2-same-offset.png"
  - type: paragraph
    text: >
      В первом запуске обработано смещение 0. Во втором запуске получатель снова читает смещение 0, а
      не следующую запись, и входящий журнал отвечает duplicate. После этого обрабатывается смещение 1.
      В базе две отметки и два эффекта, по одному на событие. Данные согласованы: действие первого
      события выполнено один раз, хотя доставлено оно дважды.

  - type: heading
    text: "Вариант А, пункт 3. Тайм-аут базы"
    level: 2
    structural: false
  - type: paragraph
    text: >
      Обработчик возвращает context.DeadlineExceeded, как при зависшей базе. Получатель делает только
      попытки записи в базу: в журнале вызовов четыре записи db и ничего больше. В карантин сообщение
      не уходит, смещение не подтверждается. Когда база «починилась», новый запуск получает то же
      смещение 0 с тем же событием. Это рисунок 5.
  - type: figure
    caption: "Тайм-аут базы: только попытки записи, карантин пуст"
    path: "./images/03-a3-deadline.png"
  - type: paragraph
    text: >
      Тайм-аут базы нельзя считать ошибкой контракта сообщения, потому что он ничего не говорит о
      самом сообщении. Сообщение корректно, и через минуту оно обработается. Если отправить его в
      карантин, корректное событие будет потеряно для получателя из-за чужой неисправности. Если при
      этом подтвердить смещение, следующее событие того же заказа обгонит пропущенное. Поэтому при
      тайм-ауте раздел стоит и ждёт. Цена - одно зависшее событие задерживает остальные в своём
      разделе.

  - type: heading
    text: "Входящий журнал на стенде"
    level: 2
    structural: false
  - type: paragraph
    text: >
      После нагрузочного опыта во входящем журнале playback 20 098 отметок о событиях заказов -
      столько же, сколько событий в очереди billing. В ленте 10 041 заказ: у каждого заказа по
      два-четыре события, а строка одна. Запрос на рисунке 6.
  - type: figure
    caption: "Входящий журнал и лента заказов на стенде"
    path: "./images/06-inbox-sql.png"

  - type: heading
    text: "Заключение"
    level: 1
    structural: true
  - type: paragraph
    text: >
      Получатель фиксирует отметку и действие одной транзакцией, а смещение - после неё. Шесть
      доставок одного события дают шесть разных смещений, один статус processed и пять duplicate, в
      базе одна отметка и один эффект. После сбоя между базой и брокером читается то же смещение, и
      повтор отсекается. Тайм-аут базы не отправляет сообщение в карантин и не подтверждает смещение.
  - type: paragraph
    text: >
      Ограничения: при временной ошибке раздел темы стоит, пока она не пройдёт; сообщения из карантина
      разбираются вручную.
